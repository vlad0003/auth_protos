syntax = "proto3";

option go_package = "internal/gen/auth;usersecretspb";

package usersSecrets;

service AuthService {
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
}

message CreateUserRequest {
    string user_id = 1;
    string password = 3;
}

message CreateUserResponse {
    string id = 1;
    string secret_key = 2;
}

message LoginRequest {
    string user_id = 1;
    string password = 2;
}

message LoginResponse {
    bool success = 1;
}